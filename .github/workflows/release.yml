name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the Android release and
# attaches the APK and the AAB to it. Run manually to get the files as a
# workflow artifact without a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (X.Y.Z)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android-release:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          v="${TAG:-$INPUT}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$v' is not X.Y.Z (tag the release vX.Y.Z)"; exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "AC_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release is signed with a debug key (installable, not for Play)."
            echo "suffix=-debugsigned" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n

      - name: Build APK and AAB
        env:
          AC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(--release "--build-name=${{ steps.version.outputs.name }}" "--build-number=${{ steps.version.outputs.number }}")
          flutter --no-version-check build apk "${args[@]}"
          flutter --no-version-check build appbundle "${args[@]}"
          mkdir -p dist
          base="agentconnect-${{ steps.version.outputs.name }}${{ steps.signing.outputs.suffix }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$base.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/$base.aab"
          (cd dist && sha256sum -- ./*.apk ./*.aab > SHA256SUMS)
          ls -l dist

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: agentconnect-android-${{ steps.version.outputs.name }}
          path: dist/*
          retention-days: 30
