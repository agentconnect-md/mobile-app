name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the Android release and
# the macOS DMG and attaches them to it. Run manually to get the files as
# workflow artifacts without a release. The two jobs are independent: the
# Android files do not wait for the Mac.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (X.Y.Z)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android-release:
    name: Android release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          v="${TAG:-$INPUT}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$v' is not X.Y.Z (tag the release vX.Y.Z)"; exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # Repository variable naming a non-production key (e.g. "test"); unset for the real key.
          SIGNING_LABEL: ${{ vars.ANDROID_SIGNING_LABEL }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "AC_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "suffix=${SIGNING_LABEL:+-$SIGNING_LABEL}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release is signed with a debug key (installable, not for Play)."
            echo "suffix=-debugsigned" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the obsolete "tools" package, which
          # current command-line tools no longer offer. Gradle fetches the
          # platform and build-tools it needs.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n

      - name: Build APK and AAB
        env:
          AC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(--release "--build-name=${{ steps.version.outputs.name }}" "--build-number=${{ steps.version.outputs.number }}")
          flutter --no-version-check build apk "${args[@]}"
          flutter --no-version-check build appbundle "${args[@]}"
          rm -rf dist && mkdir -p dist
          base="agentconnect-${{ steps.version.outputs.name }}${{ steps.signing.outputs.suffix }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$base.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/$base.aab"
          (cd dist && sha256sum -- ./*.apk ./*.aab > SHA256SUMS)
          ls -l dist

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      # A manual run has no release to attach to: the workflow artifact is its
      # only output. A release already holds the files, and a second copy there
      # only spends the account's small artifact storage quota (when the quota
      # was full, this step failed both jobs of v0.3.0 after the files were
      # attached).
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: agentconnect-android-${{ steps.version.outputs.name }}
          path: dist/*
          retention-days: 3

      # The runner is a shared machine that outlives the job: never leave the
      # decoded signing key behind.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  macos-release:
    name: macOS DMG
    # The team's Mac: the only runner with Xcode. While it is offline this job
    # waits in the queue and the release has the Android files only.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          v="${TAG:-$INPUT}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$v' is not X.Y.Z (tag the release vX.Y.Z)"; exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # scripts/dmg.sh builds the release app and wraps it in a DMG. It signs
      # with a Developer ID and notarizes only when it is told which identity
      # and which notary profile to use; both live in this Mac's keychain, and
      # the repository variables hold their NAMES, never a secret. Without them
      # the DMG is unsigned and named so: it runs, but Gatekeeper blocks it on
      # other Macs until the person allows it (README, "DMG").
      - name: Build the DMG
        env:
          AC_MAC_IDENTITY: ${{ vars.MAC_DEVELOPER_ID_IDENTITY }}
          AC_NOTARY_PROFILE: ${{ vars.MAC_NOTARY_PROFILE }}
          LANG: en_US.UTF-8
        run: |
          if [ -z "$AC_MAC_IDENTITY" ]; then
            echo "::warning::MAC_DEVELOPER_ID_IDENTITY is not set; the DMG is unsigned (Gatekeeper blocks it on other Macs)."
          elif [ -z "$AC_NOTARY_PROFILE" ]; then
            echo "::warning::MAC_NOTARY_PROFILE is not set; the DMG is signed but not notarized (Gatekeeper still blocks it on other Macs)."
          fi
          # The runner keeps its workspace: an earlier release's DMG must not ride along.
          rm -rf build/macos/dmg
          scripts/dmg.sh --build-name "${{ steps.version.outputs.name }}" --build-number "${{ steps.version.outputs.number }}"
          ls -l build/macos/dmg

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/macos/dmg/*.dmg build/macos/dmg/*.dmg.sha256 --clobber

      # Manual runs only, for the same reason as in the Android job.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: agentconnect-macos-${{ steps.version.outputs.name }}
          path: build/macos/dmg/*
          retention-days: 3
