name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      - run: flutter --no-version-check analyze
      - run: flutter --no-version-check test

  android:
    name: Android debug build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      - run: flutter --no-version-check build apk --debug
      # The APK is a convenience download. The build above is the check: a failed
      # upload (for example the account's artifact storage quota) must not fail it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agentconnect-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # The iOS simulator build lives in ios.yml. Hosted macOS runners are often
  # short on capacity, so that build is advisory and does not gate this run.
