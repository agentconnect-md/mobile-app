name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      - run: flutter --no-version-check analyze
      - run: flutter --no-version-check test

  android:
    name: Android debug build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      - run: flutter --no-version-check build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: agentconnect-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    name: iOS simulator build
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      # Compiles the app and the native sign-in bridge; no signing.
      - run: flutter --no-version-check build ios --simulator --debug --no-codesign
