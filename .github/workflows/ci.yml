name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted runners: analysis, tests and Android on the organization's Linux
# runners (self-hosted, Linux, X64); the iOS build on the team's Mac
# (self-hosted, macOS, ARM64), the only job that needs Xcode.

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: Analyze and test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      - run: flutter --no-version-check analyze
      - run: flutter --no-version-check test

  android:
    name: Android debug build
    needs: checks
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Installs the SDK command-line tools when the machine has no SDK yet.
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the obsolete "tools" package, which
          # current command-line tools no longer offer. Gradle fetches the
          # platform and build-tools it needs.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      - run: flutter --no-version-check build apk --debug
      # The APK is a convenience download. The build above is the check: a failed
      # upload (for example the account's artifact storage quota) must not fail it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agentconnect-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          # Private repos share a small artifact storage quota: keep this one day.
          retention-days: 1

  ios:
    name: iOS simulator build
    needs: checks
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --no-version-check pub get
      - run: flutter --no-version-check gen-l10n
      # Compiles the app and the native sign-in bridge; no signing. Uses the
      # Mac's Xcode and CocoaPods.
      - run: flutter --no-version-check build ios --simulator --debug --no-codesign
